version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL's init and analyze steps must move together, or every bump fails its own check.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
